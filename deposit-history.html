<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit History - SBWIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #2e1065, #022c22);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, #1e1b4b, #064e3b);
            min-height: 100vh;
            padding: 75px 16px 40px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .header {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(124, 58, 237, 0.4);
        }
        .header h2 {
            font-style: italic;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-size: 19px;
        }
        .header-back-btn {
            background: rgba(30, 27, 75, 0.8);
            border: 1px solid #7c3aed;
            color: #fff;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .history-card-item {
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid #7c3aed;
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .history-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(124, 58, 237, 0.3);
            padding-bottom: 10px;
        }
        .deposit-badge {
            background: #10b981;
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-badge {
            font-size: 14px;
            font-weight: 800;
        }
        .history-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .history-label {
            color: #94a3b8;
            font-weight: 600;
        }
        .history-val {
            color: #ffffff;
            font-weight: 600;
        }
        .balance-val {
            color: #fbbf24;
            font-weight: 800;
            font-size: 15px;
        }
        .order-row-val {
            font-family: monospace;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .copy-icon-btn {
            color: #34d399;
            cursor: pointer;
            font-size: 13px;
        }

        #toast {
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: #10b981; color: white; padding: 10px 20px; border-radius: 35px;
            font-size: 13px; font-weight: bold; opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 300000;
            text-align: center;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        #fullPageLoader {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.3s ease;
        }
        .spinner-theme {
            width: 90px;
            height: 90px;
            border: 4px solid rgba(124, 58, 237, 0.2);
            border-top: 4px solid #34d399;
            border-right: 4px solid #a855f7;
            border-radius: 50%;
            animation: spinTheme 1s linear infinite;
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.4);
        }
        @keyframes spinTheme {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes dotBlink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
        .dot-anim { animation: dotBlink 1.4s infinite; }
    </style>
</head>
<body>

    <div id="fullPageLoader">
        <div class="spinner-theme"></div>
        <div style="margin-top: 18px; font-weight: 800; font-size: 16px; color: #34d399; letter-spacing: 1px;">
            Loading<span class="dot-anim">...</span>
        </div>
    </div>

    <div id="toast">Copied successfully!</div>

    <div class="header">
        <a href="index.html#account" class="header-back-btn">&lt;</a>
        <div class="header-center"><h2>Deposit History</h2></div>
        <div style="width: 38px;"></div>
    </div>

    <div class="container">
        <div id="userDepositHistory" style="display: flex; flex-direction: column; gap: 14px;">
            <p style="font-size: 13px; color: #94a3b8; text-align: center; padding: 25px;">Loading history...</p>
        </div>
    </div>

    <script>
        let userId = localStorage.getItem('userId') || localStorage.getItem('rewards_userId');

        window.onload = async function() {
            if (!userId) {
                window.location.href = 'auth.html';
                return;
            }
            await fetchUserDeposits();
            
            const loader = document.getElementById('fullPageLoader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 300);
            }
        };

        function parseDepositStatus(rawStatus) {
            if (!rawStatus) return { text: 'Pending', color: '#fbbf24' };
            let s = String(rawStatus).toLowerCase().trim();
            if (s === 'approved' || s === 'complete' || s === 'completed' || s === 'success' || s === 'successful') {
                return { text: 'Completed', color: '#34d399' };
            }
            if (s === 'rejected' || s === 'reject' || s === 'failed' || s === 'fail') {
                return { text: 'Failed', color: '#f87171' };
            }
            return { text: 'Pending', color: '#fbbf24' };
        }

        async function fetchUserDeposits() {
            if (!userId) return;
            try {
                let res = await fetch(`/api/user-deposits/${userId}`);
                let data = await res.json();
                let container = document.getElementById('userDepositHistory');
                if (data.success && data.deposits.length > 0) {
                    container.innerHTML = '';
                    data.deposits.forEach((dep) => {
                        let statusObj = parseDepositStatus(dep.status);
                        let orderNo = dep.orderNo || (dep._id ? ('DP' + dep._id.slice(-16).toLowerCase()) : 'DP2026100803245679');
                        let d = new Date(dep.createdAt || Date.now());
                        let timeStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
                        let remarkText = dep.rejectReason ? dep.rejectReason : '--';
                        
                        container.innerHTML += `
                            <div class="history-card-item">
                                <div class="history-top-bar">
                                    <span class="deposit-badge">Deposit</span>
                                    <span class="status-badge" style="color: ${statusObj.color};">${statusObj.text}</span>
                                </div>
                                <div class="history-detail-row">
                                    <span class="history-label">Balance</span>
                                    <span class="balance-val">₹${dep.amount}.00</span>
                                </div>
                                <div class="history-detail-row">
                                    <span class="history-label">UTR</span>
                                    <span class="history-val" style="font-family: monospace;">${dep.utr}</span>
                                </div>
                                <div class="history-detail-row">
                                    <span class="history-label">Time</span>
                                    <span class="history-val" style="font-family: monospace;">${timeStr}</span>
                                </div>
                                <div class="history-detail-row">
                                    <span class="history-label">Order number</span>
                                    <span class="order-row-val">
                                        <span>${orderNo}</span>
                                        <i class="fa-regular fa-copy copy-icon-btn" onclick="copyText('${orderNo}')"></i>
                                    </span>
                                </div>
                                <div class="history-detail-row">
                                    <span class="history-label">Remarks</span>
                                    <span class="history-val" style="color: #94a3b8;">${remarkText}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="font-size: 13px; color: #94a3b8; text-align: center; padding: 25px;">No deposit history found.</p>';
                }
            } catch (e) {
                document.getElementById('userDepositHistory').innerHTML = '<p style="font-size: 13px; color: #f87171; text-align: center; padding: 25px;">Failed to load history.</p>';
            }
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt).then(() => {
                showToast('Order number copied!');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2200);
        }
    </script>
</body>
</html>
