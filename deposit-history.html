<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit History - SBWIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #2e1065, #022c22);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, #1e1b4b, #064e3b);
            min-height: 100vh;
            padding: 80px 20px 40px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .header {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 14px 16px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(124, 58, 237, 0.4);
        }
        .header h2 {
            font-style: italic;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-size: 18px;
            text-align: center;
            user-select: none;
        }
        .header a, .header-right-icon {
            background: rgba(30, 27, 75, 0.8);
            border: 1px solid #7c3aed;
            color: #fff;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .header-right {
            display: flex;
            justify-content: flex-end;
        }
        .card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid #7c3aed;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .title {
            font-size: 14px;
            color: #a7f3d0;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .custom-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            padding: 20px;
        }
        .custom-modal {
            background: #1e1b4b;
            border: 2px solid #34d399;
            width: 100%;
            max-width: 420px;
            border-radius: 22px;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #059669, #10b981);
            border: 1.5px solid #34d399;
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 17px;
            cursor: pointer;
            margin-top: 8px;
        }
        #toast {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 35px;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 300000;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toast">Success!</div>

    <!-- ORDER DETAILS POPUP MODAL -->
    <div id="orderDetailsModal" class="custom-modal-overlay">
        <div class="custom-modal">
            <div style="font-size: 18px; font-weight: bold; color: #34d399; text-align: center; margin-bottom: 15px; text-transform: uppercase;">Order Details</div>
            <div id="orderDetailsContent" style="display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: #cbd5e1; margin-bottom: 20px;">
            </div>
            <button class="submit-btn" onclick="closeOrderDetailsModal()">Close</button>
        </div>
    </div>

    <div class="header">
        <div class="header-left">
            <a href="index.html">&lt;</a>
        </div>
        <div class="header-center"><h2>Deposit History</h2></div>
        <div class="header-right">
            <a href="customer-service.html" class="header-right-icon"><i class="fa-solid fa-headset"></i></a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="title">My Deposits (Click item for details)</div>
            <div id="userDepositHistory" style="max-height: 450px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                <p style="font-size: 13px; color: #94a3b8; text-align: center; padding: 25px;">Loading deposit history...</p>
            </div>
        </div>
    </div>

    <script>
        let userId = localStorage.getItem('userId') || localStorage.getItem('rewards_userId');
        let cachedDeposits = [];

        window.onload = function() {
            if (userId) {
                fetchUserDeposits();
            } else {
                document.getElementById('userDepositHistory').innerHTML = '<p style="font-size: 13px; color: #f87171; text-align: center; padding: 25px;">Please login first.</p>';
            }
        };

        async function fetchUserDeposits() {
            if (!userId) return;
            try {
                let res = await fetch(`/api/user-deposits/${userId}`);
                let data = await res.json();
                let container = document.getElementById('userDepositHistory');
                if (data.success && data.deposits.length > 0) {
                    cachedDeposits = data.deposits;
                    container.innerHTML = '';
                    data.deposits.forEach((dep, index) => {
                        let isApproved = dep.status === 'approved';
                        let displayStatus = isApproved ? 'complete' : (dep.status === 'rejected' || dep.status === 'reject' ? 'failed' : dep.status);
                        let statusColor = isApproved ? '#34d399' : '#f87171';
                        let time = new Date(dep.createdAt).toLocaleString();
                        let orderNo = dep.orderNo || ('SBW' + (100000 + index));
                        let reasonHTML = dep.rejectReason ? `<div style="color:#f87171; font-size:11px; margin-top:4px;">Reason: ${dep.rejectReason}</div>` : '';
                        
                        container.innerHTML += `
                            <div onclick="openOrderDetails('${dep._id}')" style="background: rgba(15, 23, 42, 0.9); border: 1px solid #7c3aed; padding: 12px; border-radius: 12px; font-size: 13px; cursor: pointer;">
                                <div style="display: flex; justify-content: space-between;">
                                    <span style="color: #fbbf24; font-weight: bold;">Order: ${orderNo}</span>
                                    <span style="color: ${statusColor}; text-transform: uppercase; font-weight: bold;">${displayStatus}</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; margin-top: 4px;">
                                    <span><b>Amount:</b> ₹${dep.amount}</span>
                                    <span>UTR: ${dep.utr}</span>
                                </div>
                                ${reasonHTML}
                                <div style="color: #94a3b8; font-size: 11px; text-align: right; margin-top: 4px;">${time}</div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="font-size: 13px; color: #94a3b8; text-align: center; padding: 25px;">No deposit history found.</p>';
                }
            } catch (e) {
                document.getElementById('userDepositHistory').innerHTML = '<p style="font-size: 13px; color: #f87171; text-align: center; padding: 25px;">Failed to load history.</p>';
            }
        }

        function openOrderDetails(depositId) {
            let dep = cachedDeposits.find(d => d._id === depositId);
            if (!dep) return;

            let isApproved = dep.status === 'approved';
            let displayStatus = isApproved ? 'complete' : (dep.status === 'rejected' || dep.status === 'reject' ? 'failed' : dep.status);
            let statusColor = isApproved ? '#34d399' : '#f87171';
            let time = new Date(dep.createdAt).toLocaleString();
            let orderNo = dep.orderNo || 'SBW---';
            let reasonRow = dep.rejectReason ? `<p><b>Rejection Reason:</b> <span style="color:#f87171;">${dep.rejectReason}</span></p>` : '';

            let contentHTML = `
                <p><b>Order No:</b> <span style="color:#fbbf24;">${orderNo}</span></p>
                <p><b>Status:</b> <span style="color:${statusColor}; text-transform:uppercase; font-weight:bold;">${displayStatus}</span></p>
                <p><b>Amount:</b> <span style="color:#34d399; font-weight:bold;">₹${dep.amount}</span></p>
                <p><b>UTR Number:</b> <span style="font-family:monospace; color:#fbbf24;">${dep.utr}</span></p>
                ${reasonRow}
                <p><b>Date & Time:</b> ${time}</p>
            `;

            document.getElementById('orderDetailsContent').innerHTML = contentHTML;
            document.getElementById('orderDetailsModal').style.display = 'flex';
        }

        function closeOrderDetailsModal() {
            document.getElementById('orderDetailsModal').style.display = 'none';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
