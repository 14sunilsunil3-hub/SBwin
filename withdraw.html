<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw - SBWIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #2e1065, #022c22);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, #1e1b4b, #064e3b);
            min-height: 100vh;
            padding: 80px 20px 40px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .header {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 14px 16px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(124, 58, 237, 0.4);
        }
        .header h2 {
            font-style: italic;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-size: 20px;
            text-align: center;
        }
        .header a, .header-right-icon {
            background: rgba(30, 27, 75, 0.8);
            border: 1px solid #7c3aed;
            color: #fff;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .header-right {
            display: flex;
            justify-content: flex-end;
        }
        .card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid #7c3aed;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .title {
            font-size: 14px;
            color: #a7f3d0;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .wallet-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(124, 58, 237, 0.2));
            border: 1.5px solid #34d399;
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wallet-info .label {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .wallet-info .balance {
            font-size: 24px;
            font-weight: 900;
            color: #34d399;
        }
        .refresh-btn {
            background: rgba(30, 27, 75, 0.8);
            border: 1.5px solid #34d399;
            color: #34d399;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .notice-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px dashed #f87171;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
            color: #fca5a5;
        }
        .input-box {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #7c3aed;
            color: #fff;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 14px;
            outline: none;
        }
        .input-box:focus {
            border-color: #34d399;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #059669, #10b981);
            border: 1.5px solid #34d399;
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 17px;
            cursor: pointer;
            margin-top: 8px;
        }
        .custom-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            padding: 20px;
        }
        .custom-modal {
            background: #1e1b4b;
            border: 2px solid #34d399;
            width: 100%;
            max-width: 420px;
            border-radius: 22px;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        #toast {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 35px;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 300000;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toast">Success!</div>

    <!-- ORDER DETAILS POPUP MODAL -->
    <div id="withdrawalDetailsModal" class="custom-modal-overlay">
        <div class="custom-modal">
            <div style="font-size: 18px; font-weight: bold; color: #34d399; text-align: center; margin-bottom: 15px; text-transform: uppercase;">Withdrawal Details</div>
            <div id="withdrawalDetailsContent" style="display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: #cbd5e1; margin-bottom: 20px;">
            </div>
            <button class="submit-btn" onclick="closeWithdrawalDetailsModal()">Close</button>
        </div>
    </div>

    <div class="header">
        <div class="header-left">
            <a href="assist/win-go.html">&lt;</a>
        </div>
        <div class="header-center"><h2>Withdrawal</h2></div>
        <div class="header-right">
            <a href="customer-service.html" class="header-right-icon"><i class="fa-solid fa-headset"></i></a>
        </div>
    </div>

    <div class="container">
        <div class="wallet-card">
            <div class="wallet-info">
                <div class="label">Winnings Balance</div>
                <div class="balance">₹<span id="userWinningsBalance">0.00</span></div>
            </div>
            <div class="refresh-btn" onclick="refreshData()"><i class="fa-solid fa-rotate-right"></i></div>
        </div>

        <div class="notice-box">
            <i class="fa-solid fa-triangle-exclamation"></i> 
            <b>Notice:</b> Minimum withdrawal is ₹110. Please ensure your bank details and UPI ID are correct to avoid failure.
        </div>

        <div class="card">
            <div class="title">Withdrawal Form</div>
            <input type="number" id="withdrawAmount" class="input-box" placeholder="Enter withdrawal amount (Min ₹110)">
            <input type="text" id="accHolderName" class="input-box" placeholder="Account Holder Name">
            <input type="text" id="upiId" class="input-box" placeholder="UPI ID (e.g. name@paytm)">
            <input type="text" id="bankName" class="input-box" placeholder="Bank Name">
            <input type="text" id="accNumber" class="input-box" placeholder="Bank Account Number">
            <input type="text" id="ifscCode" class="input-box" placeholder="IFSC Code">
            <input type="text" id="mobileNumber" class="input-box" placeholder="Mobile Number">
            <button class="submit-btn" onclick="submitWithdrawal()">Withdraw Now</button>
        </div>

        <div class="card">
            <div class="title">Withdrawal History (Click for details)</div>
            <div id="userWithdrawalHistory" style="max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                <p style="font-size: 13px; color: #94a3b8; text-align: center; padding: 15px;">Loading history...</p>
            </div>
        </div>
    </div>

    <script>
        let userId = localStorage.getItem('userId') || localStorage.getItem('rewards_userId');
        let cachedWithdrawals = [];

        window.onload = function() {
            if (userId) refreshData();
        };

        function refreshData() {
            fetchWinningsBalance();
            fetchUserWithdrawals();
        }

        async function fetchWinningsBalance() {
            if (!userId) return;
            try {
                let res = await fetch(`/api/user/${userId}`);
                let data = await res.json();
                if (data.success) {
                    document.getElementById('userWinningsBalance').textContent = parseFloat(data.winningsBalance || 0).toFixed(2);
                }
            } catch (e) {}
        }

        async function fetchUserWithdrawals() {
            if (!userId) return;
            try {
                let res = await fetch(`/api/admin/requests`);
                let data = await res.json();
                let container = document.getElementById('userWithdrawalHistory');
                if (data.success && data.withdrawals) {
                    let myWithdrawals = data.withdrawals.filter(w => w.userId && (w.userId._id === userId || w.userId === userId));
                    cachedWithdrawals = myWithdrawals;
                    
                    if (myWithdrawals.length > 0) {
                        container.innerHTML = '';
                        myWithdrawals.forEach((wit, index) => {
                            let isApproved = wit.status === 'approved';
                            let displayStatus = isApproved ? 'complete' : (wit.status === 'rejected' ? 'failed' : wit.status);
                            let statusColor = isApproved ? '#34d399' : (wit.status === 'rejected' ? '#f87171' : '#fbbf24');
                            let time = new Date(wit.createdAt).toLocaleString();
                            let orderNo = wit.orderNo || ('SBW_W' + (100000 + index));
                            let reasonHTML = wit.status === 'rejected' ? `<div style="color:#f87171; font-size:11px; margin-top:4px;">Status: Failed</div>` : '';

                            container.innerHTML += `
                                <div onclick="openWithdrawalDetails('${wit._id}')" style="background: rgba(15, 23, 42, 0.9); border: 1px solid #7c3aed; padding: 12px; border-radius: 12px; font-size: 13px; cursor: pointer;">
                                    <div style="display: flex; justify-content: space-between;">
                                        <span style="color: #fbbf24; font-weight: bold;">Order: ${orderNo}</span>
                                        <span style="color: ${statusColor}; text-transform: uppercase; font-weight: bold;">${displayStatus}</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; margin-top: 4px;">
                                        <span><b>Amount:</b> ₹${wit.amount}</span>
                                        <span>UPI: ${wit.upiId || 'N/A'}</span>
                                    </div>
                                    <div style="color: #94a3b8; font-size: 11px; text-align: right; margin-top: 4px;">${time}</div>
                                </div>
                            `;
                        });
                    } else {
                        container.innerHTML = '<p style="font-size: 13px; color: #94a3b8; text-align: center; padding: 15px;">No withdrawal history found.</p>';
                    }
                }
            } catch (e) {}
        }

        async function submitWithdrawal() {
            let amount = document.getElementById('withdrawAmount').value;
            let accountHolderName = document.getElementById('accHolderName').value.trim();
            let upiId = document.getElementById('upiId').value.trim();
            let bankName = document.getElementById('bankName').value.trim();
            let accountNumber = document.getElementById('accNumber').value.trim();
            let ifsc = document.getElementById('ifscCode').value.trim();
            let mobile = document.getElementById('mobileNumber').value.trim();

            if (!amount || Number(amount) < 110) {
                showToast('Minimum withdrawal amount is ₹110!');
                return;
            }
            if (!accountHolderName || !upiId || !accountNumber || !ifsc) {
                showToast('Please fill all required bank/UPI details!');
                return;
            }

            try {
                let res = await fetch('/api/withdraw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, amount, accountHolderName, upiId, bankName, accountNumber, ifsc, mobile })
                });
                let data = await res.json();
                if (data.success) {
                    showToast('Withdrawal request submitted successfully!');
                    document.getElementById('withdrawAmount').value = '';
                    refreshData();
                } else {
                    showToast(data.message || 'Withdrawal failed');
                }
            } catch (e) {
                showToast('Server connection error');
            }
        }

        function openWithdrawalDetails(id) {
            let wit = cachedWithdrawals.find(w => w._id === id);
            if (!wit) return;

            let isApproved = wit.status === 'approved';
            let displayStatus = isApproved ? 'complete' : (wit.status === 'rejected' ? 'failed' : wit.status);
            let statusColor = isApproved ? '#34d399' : (wit.status === 'rejected' ? '#f87171' : '#fbbf24');
            let time = new Date(wit.createdAt).toLocaleString();
            let orderNo = wit.orderNo || 'SBW_W---';

            let contentHTML = `
                <p><b>Order No:</b> <span style="color:#fbbf24;">${orderNo}</span></p>
                <p><b>Status:</b> <span style="color:${statusColor}; text-transform:uppercase; font-weight:bold;">${displayStatus}</span></p>
                <p><b>Amount:</b> <span style="color:#34d399; font-weight:bold;">₹${wit.amount}</span></p>
                <p><b>Name:</b> ${wit.accountHolderName || 'N/A'}</p>
                <p><b>UPI ID:</b> <span style="color:#fbbf24;">${wit.upiId || 'N/A'}</span></p>
                <p><b>Bank / Acc:</b> ${wit.bankName || 'N/A'} (${wit.accountNumber || 'N/A'})</p>
                <p><b>IFSC:</b> ${wit.ifsc || 'N/A'}</p>
                <p><b>Date & Time:</b> ${time}</p>
            `;

            document.getElementById('withdrawalDetailsContent').innerHTML = contentHTML;
            document.getElementById('withdrawalDetailsModal').style.display = 'flex';
        }

        function closeWithdrawalDetailsModal() {
            document.getElementById('withdrawalDetailsModal').style.display = 'none';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
