<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Team RNG View</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body {
        width: 100%;
        height: 100%;
        background: transparent !important;
        color: #fff;
        overflow: hidden;
    }
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
    }
    .rng-card {
        width: 100%;
        max-width: 265px;
        background: linear-gradient(180deg, #1e1b4b 0%, #131130 100%);
        border: 1px solid rgba(124, 58, 237, 0.5);
        border-radius: 18px;
        padding: 14px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }
    .rng-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    .period-badge {
        font-size: 11px;
        font-weight: 700;
        color: #38bdf8;
        background: rgba(14, 165, 233, 0.15);
        border: 1px solid rgba(56, 189, 248, 0.35);
        padding: 3px 8px;
        border-radius: 20px;
        letter-spacing: 0.3px;
        font-family: monospace;
    }
    .timer-tabs-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin-bottom: 12px;
    }
    .timer-tab {
        background: rgba(30, 27, 75, 0.9);
        border: 1px solid rgba(124, 58, 237, 0.4);
        color: #a7f3d0;
        padding: 5px 2px;
        border-radius: 7px;
        font-size: 10px;
        font-weight: 800;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .timer-tab.active {
        background: #7c3aed;
        color: #fff;
        border-color: #38bdf8;
        box-shadow: 0 0 8px rgba(124, 58, 237, 0.5);
    }
    .single-ball-box {
        position: relative;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(124, 58, 237, 0.35);
        padding: 14px 16px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        overflow: hidden;
        min-height: 112px;
    }

    /* Full resultBox Scanning Overlay + Larger Scanner Card */
    .scan-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 10px;
        background: linear-gradient(160deg, rgba(9, 13, 22, 0.94), rgba(15, 23, 42, 0.96));
        backdrop-filter: blur(3px);
        z-index: 10;
    }
    .single-ball-box.is-scanning .scan-stage {
        display: flex;
    }
    .single-ball-box.is-scanning .result-content {
        opacity: 0;
        pointer-events: none;
    }
    .result-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        width: 100%;
        transition: opacity 0.2s ease;
    }

    .scan-btn-card {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        min-height: 88px;
        padding: 0 22px;
        border-radius: 12px;
        background: linear-gradient(145deg, #111827, #0b101b);
        border: 1px solid rgba(56, 189, 248, 0.45);
        box-shadow:
            0 10px 24px rgba(0, 0, 0, 0.6),
            inset 0 0 18px rgba(56, 189, 248, 0.14);
        overflow: hidden;
    }
    .scan-beam {
        position: absolute;
        left: 0;
        right: 0;
        top: -45%;
        height: 45%;
        background: linear-gradient(
            to bottom,
            rgba(56, 189, 248, 0) 0%,
            rgba(56, 189, 248, 0.25) 60%,
            rgba(224, 242, 254, 0.92) 100%
        );
        border-bottom: 2px solid #7dd3fc;
        box-shadow: 0 2px 14px rgba(56, 189, 248, 0.85);
        animation: scanSweep 1.25s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        pointer-events: none;
        z-index: 2;
    }
    @keyframes scanSweep {
        0% {
            top: -45%;
            opacity: 0.25;
        }
        15% {
            opacity: 1;
        }
        85% {
            opacity: 1;
        }
        100% {
            top: 115%;
            opacity: 0.25;
        }
    }
    .scanning-label {
        position: relative;
        z-index: 1;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #38bdf8;
        text-shadow: 0 0 12px rgba(56, 189, 248, 0.55);
    }

    /* Glossy 3D Ball Styles */
    .ball {
        position: relative;
        width: 58px;
        height: 58px;
        flex-shrink: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        overflow: hidden;
        outline: none;
        border: none;
        box-shadow: inset 0 -5px 7px rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.4);
        transition: transform 0.2s ease;
    }
    .ball.pop-anim {
        transform: scale(0.75);
    }
    .ball::before {
        content: '';
        position: absolute;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        z-index: 1;
    }
    .ball::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 50%;
        transform: translateX(-50%);
        width: 15px;
        height: 5px;
        background: rgba(255, 255, 255, 0.65);
        border-radius: 50%;
        z-index: 3;
    }
    .side-glow-left, .side-glow-right, .bottom-glow {
        position: absolute;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        z-index: 3;
    }
    .side-glow-left {
        top: 50%;
        left: 2px;
        transform: translateY(-50%);
        width: 5px;
        height: 13px;
    }
    .side-glow-right {
        top: 50%;
        right: 2px;
        transform: translateY(-50%);
        width: 5px;
        height: 13px;
    }
    .bottom-glow {
        bottom: 2px;
        left: 50%;
        transform: translateX(-50%);
        width: 11px;
        height: 3.5px;
    }
    .ball span {
        position: relative;
        z-index: 2;
    }

    .ball.red {
        background: radial-gradient(circle, rgba(255,107,107,0.3) 30%, #e60012 80%);
    }
    .ball.red::before {
        background: radial-gradient(circle, rgba(255,255,255,0.88) 40%, rgba(255,107,107,0.3) 100%);
    }
    .ball.red span { color: #e60012; }

    .ball.green {
        background: radial-gradient(circle, rgba(92,214,133,0.3) 30%, #00b050 80%);
    }
    .ball.green::before {
        background: radial-gradient(circle, rgba(255,255,255,0.88) 40%, rgba(92,214,133,0.3) 100%);
    }
    .ball.green span { color: #00b050; }

    .ball.split-0 {
        background: linear-gradient(135deg, #ff4d4d 0%, #cc0000 45%, #b366ff 55%, #7a00cc 100%);
    }
    .ball.split-0::before {
        background: radial-gradient(circle, rgba(255,255,255,0.88) 40%, rgba(179,102,255,0.3) 100%);
    }
    .ball.split-0 span {
        background: linear-gradient(135deg, #cc0000, #800080);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .ball.split-5 {
        background: linear-gradient(135deg, #00b050 0%, #008033 45%, #b366ff 55%, #7a00cc 100%);
    }
    .ball.split-5::before {
        background: radial-gradient(circle, rgba(255,255,255,0.88) 40%, rgba(179,102,255,0.3) 100%);
    }
    .ball.split-5 span {
        background: linear-gradient(135deg, #008033, #800080);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .result-details-col { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .status-pill {
        width: 100%;
        padding: 7px 10px;
        border-radius: 9px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        text-align: center;
        color: #fff;
        transition: all 0.2s ease;
    }
    .size-big { background: linear-gradient(135deg, #f97316, #ea580c); box-shadow: 0 3px 10px rgba(249, 115, 22, 0.35); }
    .size-small { background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 3px 10px rgba(59, 130, 246, 0.35); }
    .clr-green { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 3px 10px rgba(16, 185, 129, 0.35); }
    .clr-red { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 3px 10px rgba(239, 68, 68, 0.35); }
    .clr-violet { background: linear-gradient(135deg, #a855f7, #7c3aed); box-shadow: 0 3px 10px rgba(168, 85, 247, 0.35); }
</style>
</head>
<body>
    <div class="rng-card">
        <div class="rng-top">
            <span class="period-badge" id="periodNoHeader">Period: ---</span>
        </div>

        <div class="timer-tabs-row">
            <div class="timer-tab active" data-type="30s" onclick="switchTimer('30s', this)">30Sec</div>
            <div class="timer-tab" data-type="60s" onclick="switchTimer('60s', this)">1Min</div>
            <div class="timer-tab" data-type="3m" onclick="switchTimer('3m', this)">3Min</div>
            <div class="timer-tab" data-type="5m" onclick="switchTimer('5m', this)">5Min</div>
        </div>

        <div class="single-ball-box" id="resultBox">
            <div class="scan-stage" id="scanStage">
                <div class="scan-btn-card">
                    <div class="scan-beam"></div>
                    <span class="scanning-label">SCANNING...</span>
                </div>
            </div>

            <div class="result-content">
                <div class="ball split-0" id="activeBall">
                    <div class="side-glow-left"></div>
                    <div class="side-glow-right"></div>
                    <div class="bottom-glow"></div>
                    <span id="activeBallNumber">-</span>
                </div>
                <div class="result-details-col">
                    <div class="status-pill size-small" id="activeSizeBadge">---</div>
                    <div class="status-pill clr-violet" id="activeColorBadge">---</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('userId') || localStorage.getItem('rewards_userId') || sessionStorage.getItem('rewards_userId');
        let currentTimerType = params.get('timerType') || '30s';
        let currentPeriod = '';
        let scanTimerId = null;
        let isScanning = false;
        let pendingResultData = null;

        const ballConfig = {
            0: { ballClass: 'split-0', size: 'Small', sizeClass: 'size-small', color: 'Violet', colorClass: 'clr-violet' },
            1: { ballClass: 'green',   size: 'Small', sizeClass: 'size-small', color: 'Green',  colorClass: 'clr-green'  },
            2: { ballClass: 'red',     size: 'Small', sizeClass: 'size-small', color: 'Red',    colorClass: 'clr-red'    },
            3: { ballClass: 'green',   size: 'Small', sizeClass: 'size-small', color: 'Green',  colorClass: 'clr-green'  },
            4: { ballClass: 'red',     size: 'Small', sizeClass: 'size-small', color: 'Red',    colorClass: 'clr-red'    },
            5: { ballClass: 'split-5', size: 'Big',   sizeClass: 'size-big',   color: 'Violet', colorClass: 'clr-violet' },
            6: { ballClass: 'red',     size: 'Big',   sizeClass: 'size-big',   color: 'Red',    colorClass: 'clr-red'    },
            7: { ballClass: 'green',   size: 'Big',   sizeClass: 'size-big',   color: 'Green',  colorClass: 'clr-green'  },
            8: { ballClass: 'red',     size: 'Big',   sizeClass: 'size-big',   color: 'Red',    colorClass: 'clr-red'    },
            9: { ballClass: 'green',   size: 'Big',   sizeClass: 'size-big',   color: 'Green',  colorClass: 'clr-green'  }
        };

        function syncActiveTabUI() {
            document.querySelectorAll('.timer-tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-type') === currentTimerType);
            });
        }

        function applyResultToDOM(data) {
            currentPeriod = data.period || currentPeriod;
            document.getElementById('periodNoHeader').textContent = 'Period: ' + (currentPeriod || '---');
            const num = ((Number(data.number) % 10) + 10) % 10;
            const cfg = ballConfig[num];

            const ballEl = document.getElementById('activeBall');
            const numEl = document.getElementById('activeBallNumber');
            ballEl.classList.add('pop-anim');

            setTimeout(() => {
                ballEl.className = 'ball ' + cfg.ballClass;
                numEl.textContent = num;

                const sizeEl = document.getElementById('activeSizeBadge');
                sizeEl.textContent = (data.size || cfg.size).toUpperCase();
                sizeEl.className = 'status-pill ' + cfg.sizeClass;

                const colorEl = document.getElementById('activeColorBadge');
                colorEl.textContent = (data.color || cfg.color).toUpperCase();
                colorEl.className = 'status-pill ' + cfg.colorClass;

                ballEl.classList.remove('pop-anim');
            }, 120);
        }

        function renderRngData(data, forceImmediate = false) {
            if (isScanning && !forceImmediate) {
                pendingResultData = data;
                if (data.period) {
                    document.getElementById('periodNoHeader').textContent = 'Period: ' + data.period;
                }
                return;
            }
            applyResultToDOM(data);
        }

        function startFiveSecScan(newPeriod) {
            if (newPeriod) {
                document.getElementById('periodNoHeader').textContent = 'Period: ' + newPeriod;
            }
            isScanning = true;
            pendingResultData = null;
            document.getElementById('resultBox').classList.add('is-scanning');

            if (scanTimerId) {
                clearTimeout(scanTimerId);
            }

            scanTimerId = setTimeout(() => {
                isScanning = false;
                document.getElementById('resultBox').classList.remove('is-scanning');
                if (pendingResultData) {
                    const dataToShow = pendingResultData;
                    pendingResultData = null;
                    applyResultToDOM(dataToShow);
                } else {
                    fetchLatestRng();
                }
            }, 5000);
        }

        async function fetchLatestRng(triggerScanOnPeriodChange = false) {
            try {
                const res = await fetch(`/api/team/rng-result?userId=${encodeURIComponent(userId || '')}&timerType=${encodeURIComponent(currentTimerType)}`).then(r => r.json());
                if (res.success) {
                    const incomingPeriod = res.period || '';
                    if (triggerScanOnPeriodChange && incomingPeriod && incomingPeriod !== currentPeriod) {
                        currentPeriod = incomingPeriod;
                        pendingResultData = res;
                        if (!isScanning) {
                            startFiveSecScan(incomingPeriod);
                        }
                    } else {
                        renderRngData(res);
                    }
                }
            } catch (err) {}
        }

        function switchTimer(type, el) {
            currentTimerType = type;
            syncActiveTabUI();
            fetchLatestRng(false);
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'SET_TIMER_TYPE' && event.data.timerType) {
                currentTimerType = event.data.timerType;
                syncActiveTabUI();
                fetchLatestRng(false);
            }
        });

        ['30s', '60s', '3m', '5m'].forEach(type => {
            socket.on(`timerTick_${type}`, (tick) => {
                if (currentTimerType === type && tick && tick.period && tick.period !== currentPeriod) {
                    currentPeriod = tick.period;
                    startFiveSecScan(tick.period);
                    fetchLatestRng(false);
                }
            });
        });

        // Auto refresh fallback every 3 seconds so updates stay synced even if a socket tick is missed
        setInterval(() => {
            fetchLatestRng(true);
        }, 3000);

        syncActiveTabUI();
        fetchLatestRng(false);
    </script>
</body>
</html>
