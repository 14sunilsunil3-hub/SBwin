<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Team RNG View</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
        color: #fff;
        padding: 12px;
    }
    .rng-card {
        width: 100%;
        max-width: 265px;
        background: linear-gradient(180deg, #1e1b4b 0%, #131130 100%);
        border: 1px solid rgba(124, 58, 237, 0.5);
        border-radius: 18px;
        padding: 14px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }
    .rng-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    .period-badge {
        font-size: 11px;
        font-weight: 700;
        color: #38bdf8;
        background: rgba(14, 165, 233, 0.15);
        border: 1px solid rgba(56, 189, 248, 0.35);
        padding: 3px 8px;
        border-radius: 20px;
    }
    .timer-tabs-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin-bottom: 12px;
    }
    .timer-tab {
        background: rgba(30, 27, 75, 0.9);
        border: 1px solid rgba(124, 58, 237, 0.4);
        color: #a7f3d0;
        padding: 5px 2px;
        border-radius: 7px;
        font-size: 10px;
        font-weight: 800;
        text-align: center;
        cursor: pointer;
    }
    .timer-tab.active {
        background: #7c3aed;
        color: #fff;
        border-color: #38bdf8;
    }
    .single-ball-box {
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(124, 58, 237, 0.35);
        padding: 14px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
    }
    .ball {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 900;
        flex-shrink: 0;
        box-shadow: inset 0 -5px 7px rgba(0,0,0,0.35), 0 4px 10px rgba(0,0,0,0.4);
    }
    .ball.red { background: radial-gradient(circle, #ff8585 20%, #e60012 85%); color: #fff; }
    .ball.green { background: radial-gradient(circle, #7ce8a2 20%, #00b050 85%); color: #fff; }
    .ball.split-0 { background: linear-gradient(135deg, #ff4d4d 48%, #7a00cc 52%); color: #fff; }
    .ball.split-5 { background: linear-gradient(135deg, #00b050 48%, #7a00cc 52%); color: #fff; }

    .result-details-col { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .status-pill {
        width: 100%;
        padding: 7px 10px;
        border-radius: 9px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        text-align: center;
        color: #fff;
    }
    .size-big { background: linear-gradient(135deg, #f97316, #ea580c); }
    .size-small { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .clr-green { background: linear-gradient(135deg, #10b981, #059669); }
    .clr-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .clr-violet { background: linear-gradient(135deg, #a855f7, #7c3aed); }

    .refresh-btn {
        margin-top: 12px;
        width: 100%;
        background: linear-gradient(135deg, #38bdf8, #0284c7);
        border: none;
        color: #fff;
        padding: 10px;
        border-radius: 10px;
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }
    .refresh-btn i.spin { animation: spinAnim 0.7s linear infinite; }
    @keyframes spinAnim { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
    <div class="rng-card">
        <div class="rng-top">
            <span class="period-badge" id="periodNoHeader">Period: ---</span>
        </div>

        <div class="timer-tabs-row">
            <div class="timer-tab active" data-type="30s" onclick="switchTimer('30s', this)">30Sec</div>
            <div class="timer-tab" data-type="60s" onclick="switchTimer('60s', this)">1Min</div>
            <div class="timer-tab" data-type="3m" onclick="switchTimer('3m', this)">3Min</div>
            <div class="timer-tab" data-type="5m" onclick="switchTimer('5m', this)">5Min</div>
        </div>

        <div class="single-ball-box">
            <div class="ball split-0" id="activeBall"><span id="activeBallNumber">-</span></div>
            <div class="result-details-col">
                <div class="status-pill size-small" id="activeSizeBadge">---</div>
                <div class="status-pill clr-violet" id="activeColorBadge">---</div>
            </div>
        </div>

        <button type="button" class="refresh-btn" id="refreshBtn" onclick="loadRngResult()">
            <i class="fa-solid fa-rotate-right" id="refreshIcon"></i>
            <span>Refresh</span>
        </button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('userId') || localStorage.getItem('rewards_userId') || sessionStorage.getItem('rewards_userId');
        let currentTimerType = params.get('timerType') || '30s';

        const ballConfig = {
            0: { ballClass: 'split-0', size: 'Small', sizeClass: 'size-small', color: 'Violet', colorClass: 'clr-violet' },
            1: { ballClass: 'green',   size: 'Small', sizeClass: 'size-small', color: 'Green',  colorClass: 'clr-green'  },
            2: { ballClass: 'red',     size: 'Small', sizeClass: 'size-small', color: 'Red',    colorClass: 'clr-red'    },
            3: { ballClass: 'green',   size: 'Small', sizeClass: 'size-small', color: 'Green',  colorClass: 'clr-green'  },
            4: { ballClass: 'red',     size: 'Small', sizeClass: 'size-small', color: 'Red',    colorClass: 'clr-red'    },
            5: { ballClass: 'split-5', size: 'Big',   sizeClass: 'size-big',   color: 'Violet', colorClass: 'clr-violet' },
            6: { ballClass: 'red',     size: 'Big',   sizeClass: 'size-big',   color: 'Red',    colorClass: 'clr-red'    },
            7: { ballClass: 'green',   size: 'Big',   sizeClass: 'size-big',   color: 'Green',  colorClass: 'clr-green'  },
            8: { ballClass: 'red',     size: 'Big',   sizeClass: 'size-big',   color: 'Red',    colorClass: 'clr-red'    },
            9: { ballClass: 'green',   size: 'Big',   sizeClass: 'size-big',   color: 'Green',  colorClass: 'clr-green'  }
        };

        function syncActiveTabUI() {
            document.querySelectorAll('.timer-tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-type') === currentTimerType);
            });
        }

        function renderRngData(data) {
            document.getElementById('periodNoHeader').textContent = 'Period: ' + (data.period || '---');
            const num = ((Number(data.number) % 10) + 10) % 10;
            const cfg = ballConfig[num];

            const ballEl = document.getElementById('activeBall');
            ballEl.className = 'ball ' + cfg.ballClass;
            document.getElementById('activeBallNumber').textContent = num;

            const sizeEl = document.getElementById('activeSizeBadge');
            sizeEl.textContent = (data.size || cfg.size).toUpperCase();
            sizeEl.className = 'status-pill ' + cfg.sizeClass;

            const colorEl = document.getElementById('activeColorBadge');
            colorEl.textContent = (data.color || cfg.color).toUpperCase();
            colorEl.className = 'status-pill ' + cfg.colorClass;
        }

        async function loadRngResult() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('spin');
            try {
                const res = await fetch(`/api/team/rng-result?userId=${encodeURIComponent(userId || '')}&timerType=${encodeURIComponent(currentTimerType)}`).then(r => r.json());
                if (res.success) {
                    renderRngData(res);
                }
            } catch (err) {}
            setTimeout(() => icon.classList.remove('spin'), 300);
        }

        function switchTimer(type, el) {
            currentTimerType = type;
            syncActiveTabUI();
            loadRngResult();
        }

        ['30s', '60s', '3m', '5m'].forEach(type => {
            socket.on(`timerTick_${type}`, (tick) => {
                if (currentTimerType === type) {
                    const prevText = document.getElementById('periodNoHeader').textContent;
                    const newText = 'Period: ' + (tick.period || '---');
                    if (prevText !== newText) {
                        loadRngResult();
                    }
                }
            });
        });

        syncActiveTabUI();
        loadRngResult();
    </script>
</body>
</html>
