<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - SBWIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #2e1065, #022c22);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, #1e1b4b, #064e3b);
            min-height: 100vh;
            padding: 130px 20px 40px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .header {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 14px 16px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(124, 58, 237, 0.4);
        }
        .header h2 {
            font-style: italic;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-size: 18px;
            text-align: center;
        }
        .header a {
            background: rgba(30, 27, 75, 0.8);
            border: 1px solid #7c3aed;
            color: #fff;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        /* Tab Navigation Bar */
        .tab-bar {
            position: fixed;
            top: 68px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            display: flex;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px 16px;
            gap: 10px;
            z-index: 999;
            border-bottom: 1px solid rgba(124, 58, 237, 0.3);
        }
        .tab-btn {
            flex: 1;
            background: rgba(30, 27, 75, 0.6);
            border: 1.5px solid #7c3aed;
            color: #cbd5e1;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: #10b981;
            border-color: #34d399;
            color: #fff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .search-box-wrap {
            position: relative;
            margin-bottom: 20px;
        }
        .search-box-wrap input {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #7c3aed;
            color: #fff;
            padding: 14px 16px 14px 45px;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
        }
        .search-box-wrap input:focus {
            border-color: #34d399;
        }
        .search-box-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a7f3d0;
            font-size: 16px;
        }
        .requests-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .req-item {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #7c3aed;
            padding: 16px;
            border-radius: 16px;
            font-size: 13px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .req-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .approve-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        .reject-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }
        .modal-box {
            background: #1e1b4b;
            border: 2px solid #34d399;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 22px;
        }
        .modal-box textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #7c3aed;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            height: 90px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        .hidden { display: none !important; }
        #toast {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 35px;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100000;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toast">Success!</div>

    <!-- Rejection Reason Modal -->
    <div id="rejectModal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size: 16px; font-weight: bold; color: #f87171; margin-bottom: 12px;" id="modalTitleText">Enter Rejection Reason</div>
            <textarea id="rejectReasonInput" placeholder="e.g. Incorrect UTR or Details mismatch"></textarea>
            <div style="display: flex; gap: 10px;">
                <button class="reject-btn" onclick="closeRejectModal()">Cancel</button>
                <button class="approve-btn" onclick="confirmReject()">Submit Reject</button>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="header-left">
            <a href="deposit.html">&lt;</a>
        </div>
        <div class="header-center"><h2>Admin Panel</h2></div>
        <div class="header-right"></div>
    </div>

    <!-- Tab Buttons -->
    <div class="tab-bar">
        <button class="tab-btn active" id="depositTabBtn" onclick="switchTab('deposit')">Deposit Control</button>
        <button class="tab-btn" id="withdrawalTabBtn" onclick="switchTab('withdrawal')">Withdrawal Control</button>
    </div>

    <div class="container">
        <!-- Search Box -->
        <div class="search-box-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search by Order No, UTR or Phone..." oninput="filterCurrentList()">
        </div>

        <!-- Deposit Section -->
        <div id="depositSection" class="requests-list">
            <p style="text-align:center; color:#94a3b8; margin-top:20px;">Loading deposit requests...</p>
        </div>

        <!-- Withdrawal Section -->
        <div id="withdrawalSection" class="requests-list hidden">
            <p style="text-align:center; color:#94a3b8; margin-top:20px;">Loading withdrawal requests...</p>
        </div>
    </div>

    <script>
        let allDeposits = [];
        let allWithdrawals = [];
        let currentTab = 'deposit';
        let activeActionId = null;
        let activeActionType = null;

        window.onload = function() {
            loadAdminData();
        };

        async function loadAdminData() {
            try {
                let res = await fetch('/api/admin/requests');
                let data = await res.json();
                if (data.success) {
                    allDeposits = data.deposits.filter(d => d.status === 'pending');
                    allWithdrawals = data.withdrawals.filter(w => w.status === 'pending');
                    renderDeposits(allDeposits);
                    renderWithdrawals(allWithdrawals);
                } else {
                    showToast('Failed to load admin data');
                }
            } catch (e) {
                showToast('Server connection error');
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('searchInput').value = '';
            if (tab === 'deposit') {
                document.getElementById('depositTabBtn').classList.add('active');
                document.getElementById('withdrawalTabBtn').classList.remove('active');
                document.getElementById('depositSection').classList.remove('hidden');
                document.getElementById('withdrawalSection').classList.add('hidden');
                renderDeposits(allDeposits);
            } else {
                document.getElementById('withdrawalTabBtn').classList.add('active');
                document.getElementById('depositTabBtn').classList.remove('active');
                document.getElementById('withdrawalSection').classList.remove('hidden');
                document.getElementById('depositSection').classList.add('hidden');
                renderWithdrawals(allWithdrawals);
            }
        }

        function renderDeposits(deposits) {
            let container = document.getElementById('depositSection');
            if (deposits.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:20px;">No pending deposit requests.</p>';
                return;
            }

            container.innerHTML = '';
            deposits.forEach((dep, index) => {
                let userPhone = dep.userId ? dep.userId.phone : 'Unknown';
                let uid = dep.userId ? dep.userId.uid : '---';
                let time = new Date(dep.createdAt).toLocaleString();
                let orderNo = dep.orderNo || ('SBW' + (100000 + index));

                container.innerHTML += `
                    <div class="req-item">
                        <p><b>Order No:</b> <span style="color:#fbbf24; font-weight:bold;">${orderNo}</span></p>
                        <p><b>User UID:</b> ${uid} (${userPhone})</p>
                        <p><b>Amount:</b> <span style="color:#34d399; font-weight:bold; font-size:15px;">₹${dep.amount}</span></p>
                        <p><b>UTR:</b> <span style="font-family:monospace; color:#fbbf24; font-size:14px;">${dep.utr}</span></p>
                        <p style="font-size:11px; color:#94a3b8; margin-top:4px;">Time: ${time}</p>
                        <div class="req-actions">
                            <button class="approve-btn" onclick="processAction('${dep._id}', 'deposit', 'approve')">Approve</button>
                            <button class="reject-btn" onclick="promptReject('${dep._id}', 'deposit')">Reject</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderWithdrawals(withdrawals) {
            let container = document.getElementById('withdrawalSection');
            if (withdrawals.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:20px;">No pending withdrawal requests.</p>';
                return;
            }

            container.innerHTML = '';
            withdrawals.forEach((wit, index) => {
                let userPhone = wit.userId ? wit.userId.phone : (wit.mobile || 'Unknown');
                let uid = wit.userId ? wit.userId.uid : '---';
                let time = new Date(wit.createdAt).toLocaleString();

                container.innerHTML += `
                    <div class="req-item">
                        <p><b>User UID:</b> ${uid} (${userPhone})</p>
                        <p><b>Amount:</b> <span style="color:#34d399; font-weight:bold; font-size:15px;">₹${wit.amount}</span></p>
                        <p><b>Name:</b> ${wit.accountHolderName || 'N/A'}</p>
                        <p><b>UPI ID:</b> <span style="color:#fbbf24;">${wit.upiId || 'N/A'}</span></p>
                        <p><b>Bank / Acc:</b> ${wit.bankName || 'N/A'} (${wit.accountNumber || 'N/A'})</p>
                        <p><b>IFSC:</b> ${wit.ifsc || 'N/A'}</p>
                        <p style="font-size:11px; color:#94a3b8; margin-top:4px;">Time: ${time}</p>
                        <div class="req-actions">
                            <button class="approve-btn" onclick="processAction('${wit._id}', 'withdrawal', 'approve')">Approve</button>
                            <button class="reject-btn" onclick="promptReject('${wit._id}', 'withdrawal')">Reject</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCurrentList() {
            let query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (currentTab === 'deposit') {
                let filtered = allDeposits.filter(dep => {
                    let orderNo = (dep.orderNo || '').toLowerCase();
                    let utr = (dep.utr || '').toLowerCase();
                    let phone = (dep.userId && dep.userId.phone) ? dep.userId.phone.toLowerCase() : '';
                    return orderNo.includes(query) || utr.includes(query) || phone.includes(query);
                });
                renderDeposits(filtered);
            } else {
                let filtered = allWithdrawals.filter(wit => {
                    let upi = (wit.upiId || '').toLowerCase();
                    let name = (wit.accountHolderName || '').toLowerCase();
                    let phone = (wit.userId && wit.userId.phone) ? wit.userId.phone.toLowerCase() : (wit.mobile || '').toLowerCase();
                    return upi.includes(query) || name.includes(query) || phone.includes(query);
                });
                renderWithdrawals(filtered);
            }
        }

        function promptReject(id, type) {
            activeActionId = id;
            activeActionType = type;
            document.getElementById('rejectReasonInput').value = '';
            document.getElementById('rejectModal').style.display = 'flex';
        }

        function closeRejectModal() {
            document.getElementById('rejectModal').style.display = 'none';
            activeActionId = null;
            activeActionType = null;
        }

        function confirmReject() {
            let reason = document.getElementById('rejectReasonInput').value.trim();
            if (!reason) {
                showToast('Please enter rejection reason!');
                return;
            }
            let id = activeActionId;
            let type = activeActionType;
            closeRejectModal();
            processAction(id, type, 'reject', reason);
        }

        async function processAction(id, type, action, reason = '') {
            try {
                let res = await fetch('/api/admin/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, id, action, reason })
                });
                let data = await res.json();
                if (data.success) {
                    showToast(`${type.toUpperCase()} ${action}d successfully!`);
                    loadAdminData();
                } else {
                    showToast(data.message || 'Action failed');
                }
            } catch (e) {
                showToast('Server error');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
