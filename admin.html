<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - SBWIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #2e1065, #022c22);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, #1e1b4b, #064e3b);
            min-height: 100vh;
            padding: 90px 20px 40px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .header {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 14px 16px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(124, 58, 237, 0.4);
        }
        .header h2 {
            font-style: italic;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-size: 18px;
            text-align: center;
        }
        .header a {
            background: rgba(30, 27, 75, 0.8);
            border: 1px solid #7c3aed;
            color: #fff;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        .hub-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        .hub-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid #7c3aed;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .hub-card:hover {
            border-color: #34d399;
            transform: translateY(-2px);
        }
        .hub-card-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .hub-icon {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #7c3aed, #10b981);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .hub-info h3 {
            font-size: 18px;
            color: #34d399;
            margin-bottom: 4px;
        }
        .hub-info p {
            font-size: 13px;
            color: #94a3b8;
        }
        .hub-arrow {
            font-size: 18px;
            color: #c084fc;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <a href="deposit.html">&lt;</a>
        </div>
        <div class="header-center"><h2>Admin Dashboard</h2></div>
        <div class="header-right"></div>
    </div>

    <div class="container">
        <div style="text-align: center; margin-bottom: 25px;">
            <h3 style="font-size: 20px; color: #a7f3d0; margin-bottom: 6px;">Select Control Panel</h3>
            <p style="font-size: 13px; color: #94a3b8;">Manage user deposits and withdrawal requests smoothly.</p>
        </div>

        <div class="hub-grid">
            <!-- Deposit Option -->
            <a href="deposit-admin.html" class="hub-card">
                <div class="hub-card-left">
                    <div class="hub-icon"><i class="fa-solid fa-wallet"></i></div>
                    <div class="hub-info">
                        <h3>Deposit Control</h3>
                        <p>Approve, reject & search UTR/Orders</p>
                    </div>
                </div>
                <div class="hub-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </a>

            <!-- Withdrawal Option (Coming Next) -->
            <a href="#" onclick="showToast('Withdrawal panel coming soon!')" class="hub-card" style="opacity: 0.7;">
                <div class="hub-card-left">
                    <div class="hub-icon" style="background: linear-gradient(135deg, #ef4444, #f59e0b);"><i class="fa-solid fa-money-bill-transfer"></i></div>
                    <div class="hub-info">
                        <h3>Withdrawal Control</h3>
                        <p>Manage payout and bank requests</p>
                    </div>
                </div>
                <div class="hub-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </a>
        </div>
    </div>

    <div id="toast" style="position:fixed; top:25px; left:50%; transform:translateX(-50%) translateY(-20px); background:#10b981; color:white; padding:12px 24px; border-radius:35px; font-size:14px; font-weight:bold; opacity:0; pointer-events:none; transition:all 0.3s ease; z-index:100000;">Success!</div>

    <script>
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
