<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit - SBWIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #2e1065, #022c22);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, #1e1b4b, #064e3b);
            min-height: 100vh;
            padding: 60px 16px 20px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .header {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 10px 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(124, 58, 237, 0.4);
        }
        .header h2 {
            font-style: italic;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-size: 18px;
            text-align: center;
        }
        .header a {
            background: rgba(30, 27, 75, 0.8);
            border: 1px solid #7c3aed;
            color: #fff;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
        .card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #7c3aed;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
        }
        .title {
            font-size: 13px;
            color: #a7f3d0;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }
        .amt-btn {
            background: rgba(30, 27, 75, 0.6);
            border: 1px solid #7c3aed;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }
        .amt-btn.active {
            background: #10b981;
            border-color: #34d399;
        }
        .input-box {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #7c3aed;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }
        .qr-section {
            text-align: center;
            margin: 15px 0;
        }
        .qr-box {
            background: #fff;
            padding: 15px;
            display: inline-block;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .qr-box img {
            width: 160px;
            height: 160px;
            display: block;
        }
        .upi-id-text {
            color: #34d399;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #059669, #10b981);
            border: 1px solid #34d399;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100000;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toast">Success!</div>

    <div class="header">
        <div class="header-left"><a href="win-go.html">&lt;</a></div>
        <div class="header-center"><h2>Deposit</h2></div>
        <div></div>
    </div>

    <div class="container">
        <!-- Amount Selection Card -->
        <div class="card">
            <div class="title">Select Deposit Amount</div>
            <div class="amount-grid">
                <div class="amt-btn active" onclick="setAmount(100, this)">₹100</div>
                <div class="amt-btn" onclick="setAmount(500, this)">₹500</div>
                <div class="amt-btn" onclick="setAmount(1000, this)">₹1000</div>
                <div class="amt-btn" onclick="setAmount(5000, this)">₹5000</div>
                <div class="amt-btn" onclick="setAmount(10000, this)">₹10000</div>
                <div class="amt-btn" onclick="setAmount(20000, this)">₹20000</div>
            </div>
            <input type="number" id="depositAmount" class="input-box" value="100" placeholder="Enter custom amount">
        </div>

        <!-- QR / UPI Payment Card -->
        <div class="card qr-section">
            <div class="title" style="text-align: left;">Scan QR & Pay via any UPI App</div>
            <div class="qr-box">
                <!-- Yahan apna QR code image link ya asset laga sakte ho -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=upi://pay?pa=yourupi@oksbi&pn=SBWIN" alt="UPI QR Code">
            </div>
            <div class="upi-id-text">UPI ID: <span id="upiIdDisplay">yourupi@oksbi</span></div>
            <p style="font-size: 11px; color: #94a3b8;">Payment karne ke baad 12-digit UTR/Reference number niche enter karein.</p>
        </div>

        <!-- UTR Submit Card -->
        <div class="card">
            <div class="title">Enter UTR / Transaction ID</div>
            <input type="text" id="utrNumber" class="input-box" placeholder="Enter 12-digit UTR number" maxlength="12">
            <button class="submit-btn" onclick="submitDeposit()">Submit Deposit Request</button>
        </div>
    </div>

    <script>
        let selectedAmount = 100;
        let userId = localStorage.getItem('rewards_userId') || sessionStorage.getItem('rewards_userId');

        function setAmount(amt, el) {
            selectedAmount = amt;
            document.getElementById('depositAmount').value = amt;
            document.querySelectorAll('.amt-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        async function submitDeposit() {
            let amt = document.getElementById('depositAmount').value;
            let utr = document.getElementById('utrNumber').value.trim();

            if (!amt || amt <= 0) {
                showToast('Please enter valid amount!');
                return;
            }
            if (!utr || utr.length < 6) {
                showToast('Please enter valid 12-digit UTR number!');
                return;
            }
            if (!userId) {
                showToast('User not logged in!');
                return;
            }

            try {
                let res = await fetch('/api/deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, amount: parseFloat(amt), utr })
                });
                let data = await res.json();
                if (data.success) {
                    showToast('Deposit request submitted successfully!');
                    setTimeout(() => {
                        window.location.href = 'win-go.html';
                    }, 1500);
                } else {
                    showToast(data.message || 'Error submitting request');
                }
            } catch(e) {
                showToast('Server error!');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
