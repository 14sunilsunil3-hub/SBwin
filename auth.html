<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBWIN - Authentication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #2e1065, #022c22);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid #7c3aed;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .brand-title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .auth-tabs {
            display: flex;
            background: rgba(30, 27, 75, 0.6);
            border: 1px solid #7c3aed;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            color: #a7f3d0;
            transition: all 0.3s ease;
        }
        .auth-tab.active {
            background: #7c3aed;
            color: white;
            border: 1px solid #34d399;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            font-size: 11px;
            color: #a7f3d0;
            font-weight: bold;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
        }
        .form-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #7c3aed;
            color: #fff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-input:focus {
            border-color: #34d399;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #059669, #10b981);
            border: 1px solid #34d399;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .forgot-link {
            text-align: right;
            font-size: 12px;
            color: #34d399;
            margin-top: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100000;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toast">Notification</div>

    <div class="auth-container">
        <div class="brand-title">SBWIN</div>

        <div class="auth-tabs" id="authTabsContainer">
            <div class="auth-tab active" id="tabLoginBtn" onclick="switchMode('login')">Login</div>
            <div class="auth-tab" id="tabRegisterBtn" onclick="switchMode('register')">Register</div>
        </div>

        <!-- Login Form -->
        <div id="loginForm">
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="loginPhone" class="form-input" placeholder="Enter mobile number">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-input" placeholder="Enter password">
            </div>
            <div class="forgot-link" onclick="switchMode('forgot')">Forgot Password?</div>
            <button class="submit-btn" onclick="handleLogin()">Login Now</button>
        </div>

        <!-- Register Form -->
        <div id="registerForm" style="display: none;">
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="regPhone" class="form-input" placeholder="Enter mobile number">
            </div>
            <div class="form-group">
                <label class="form-label">Create Password (Min 6 chars, Letters + Numbers)</label>
                <input type="password" id="regPassword" class="form-input" placeholder="Create password">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="regConfirmPassword" class="form-input" placeholder="Confirm password">
            </div>
            <div class="form-group">
                <label class="form-label">Invite Code (Optional)</label>
                <input type="text" id="regRef" class="form-input" placeholder="Enter referral code">
            </div>
            <button class="submit-btn" onclick="handleRegister()">Register Account</button>
        </div>

        <!-- Forgot Password Form -->
        <div id="forgotForm" style="display: none;">
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="forgotPhone" class="form-input" placeholder="Enter registered mobile">
            </div>
            <div class="form-group">
                <label class="form-label">6-Digit OTP</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="forgotOtp" class="form-input" placeholder="Enter 6-digit OTP" maxlength="6">
                    <button onclick="sendOtp()" style="background:#7c3aed; border:none; color:#fff; padding:0 12px; border-radius:10px; font-weight:bold; cursor:pointer; font-size:12px;">Get OTP</button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">New Password (Min 6 chars, Letters + Numbers)</label>
                <input type="password" id="forgotNewPassword" class="form-input" placeholder="New password">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="forgotConfirmPassword" class="form-input" placeholder="Confirm new password">
            </div>
            <button class="submit-btn" onclick="handleResetPassword()">Reset Password</button>
            <div class="forgot-link" style="text-align:center; margin-top:12px;" onclick="switchMode('login')">Back to Login</div>
        </div>
    </div>

    <script>
        function switchMode(mode) {
            document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('forgotForm').style.display = mode === 'forgot' ? 'block' : 'none';
            document.getElementById('authTabsContainer').style.display = mode === 'forgot' ? 'none' : 'flex';

            if (mode === 'login') {
                document.getElementById('tabLoginBtn').classList.add('active');
                document.getElementById('tabRegisterBtn').classList.remove('active');
            } else if (mode === 'register') {
                document.getElementById('tabRegisterBtn').classList.add('active');
                document.getElementById('tabLoginBtn').classList.remove('active');
            }
        }

        function validatePassword(pwd) {
            if (pwd.length < 6) return "Password must be at least 6 characters long!";
            let hasLetter = /[a-zA-Z]/.test(pwd);
            let hasNumber = /[0-9]/.test(pwd);
            if (!hasLetter || !hasNumber) return "Password must contain a mix of letters and numbers!";
            return null;
        }

        async function handleLogin() {
            let phone = document.getElementById('loginPhone').value.trim();
            let password = document.getElementById('loginPassword').value.trim();

            if (!phone || !password) {
                showToast('Please fill all fields!');
                return;
            }

            try {
                let res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                let data = await res.json();
                if (data.success) {
                    localStorage.setItem('rewards_userId', data.userId);
                    localStorage.setItem('rewards_loggedMobile', phone);
                    localStorage.setItem('lastActiveTime', Date.now());
                    showToast('Login successful!');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showToast(data.message || 'Login failed');
                }
            } catch(e) {
                showToast('Server connection error');
            }
        }

        async function handleRegister() {
            let phone = document.getElementById('regPhone').value.trim();
            let password = document.getElementById('regPassword').value.trim();
            let confirmPassword = document.getElementById('regConfirmPassword').value.trim();
            let refUid = document.getElementById('regRef').value.trim();

            if (!phone || !password || !confirmPassword) {
                showToast('Please fill all required fields!');
                return;
            }

            if (password !== confirmPassword) {
                showToast('Passwords do not match!');
                return;
            }

            let pwdError = validatePassword(password);
            if (pwdError) {
                showToast(pwdError);
                return;
            }

            try {
                let res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password, refUid })
                });
                let data = await res.json();
                if (data.success) {
                    showToast('Registration successful! Please login.');
                    switchMode('login');
                    document.getElementById('loginPhone').value = phone;
                } else {
                    showToast(data.message || 'Registration failed');
                }
            } catch(e) {
                showToast('Server connection error');
            }
        }

        function sendOtp() {
            let phone = document.getElementById('forgotPhone').value.trim();
            if (!phone) {
                showToast('Please enter your phone number first!');
                return;
            }
            showToast('OTP sent successfully: 123456 (Demo)');
        }

        async function handleResetPassword() {
            let phone = document.getElementById('forgotPhone').value.trim();
            let otp = document.getElementById('forgotOtp').value.trim();
            let newPassword = document.getElementById('forgotNewPassword').value.trim();
            let confirmNewPassword = document.getElementById('forgotConfirmPassword').value.trim();

            if (!phone || !otp || !newPassword || !confirmNewPassword) {
                showToast('Please fill all fields!');
                return;
            }

            if (otp !== '123456') {
                showToast('Invalid OTP! Use 123456');
                return;
            }

            if (newPassword !== confirmNewPassword) {
                showToast('Passwords do not match!');
                return;
            }

            let pwdError = validatePassword(newPassword);
            if (pwdError) {
                showToast(pwdError);
                return;
            }

            try {
                let res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, newPassword })
                });
                let data = await res.json();
                if (data.success) {
                    showToast('Password reset successful! Please login.');
                    switchMode('login');
                } else {
                    showToast(data.message || 'Reset failed');
                }
            } catch(e) {
                showToast('Server error');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
