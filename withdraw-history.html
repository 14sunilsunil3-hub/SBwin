<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw History - SBWIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #2e1065, #022c22);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, #1e1b4b, #064e3b);
            min-height: 100vh;
            padding: 75px 18px 40px 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .header {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(124, 58, 237, 0.4);
        }
        .header h2 {
            font-style: italic;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-size: 19px;
        }
        .header-back-btn {
            background: rgba(30, 27, 75, 0.8);
            border: 1px solid #7c3aed;
            color: #fff;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .card {
            background: rgba(15, 23, 42, 0.75);
            border: 1.5px solid #7c3aed;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .title {
            font-size: 13px;
            color: #a7f3d0;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #fullPageLoader {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.3s ease;
        }
        .spinner-theme {
            width: 90px;
            height: 90px;
            border: 4px solid rgba(124, 58, 237, 0.2);
            border-top: 4px solid #34d399;
            border-right: 4px solid #a855f7;
            border-radius: 50%;
            animation: spinTheme 1s linear infinite;
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.4);
        }
        @keyframes spinTheme {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes dotBlink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
        .dot-anim { animation: dotBlink 1.4s infinite; }
    </style>
</head>
<body>

    <div id="fullPageLoader">
        <div class="spinner-theme"></div>
        <div style="margin-top: 18px; font-weight: 800; font-size: 16px; color: #34d399; letter-spacing: 1px;">
            Loading<span class="dot-anim">...</span>
        </div>
    </div>

    <div class="header">
        <a href="index.html" class="header-back-btn">&lt;</a>
        <div class="header-center"><h2>Withdraw History</h2></div>
        <div style="width: 38px;"></div>
    </div>

    <div class="container">
        <div class="card" id="historySection">
            <div class="title">Withdrawal History Records</div>
            <div id="userWithdrawalHistory" style="display: flex; flex-direction: column; gap: 10px;">
                <p style="font-size: 13px; color: #94a3b8; text-align: center; padding: 15px;">Loading history...</p>
            </div>
        </div>
    </div>

    <script>
        let userId = localStorage.getItem('userId') || localStorage.getItem('rewards_userId');

        window.onload = async function() {
            if (!userId) {
                window.location.href = 'auth.html';
                return;
            }
            await fetchUserWithdrawals();
            
            const loader = document.getElementById('fullPageLoader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 300);
            }
        };

        async function fetchUserWithdrawals() {
            try {
                let res = await fetch(`/api/admin/requests`);
                let data = await res.json();
                let container = document.getElementById('userWithdrawalHistory');
                if (data.success && data.withdrawals) {
                    let myWithdrawals = data.withdrawals.filter(w => w.userId && (w.userId._id === userId || w.userId === userId));

                    if (myWithdrawals.length > 0) {
                        container.innerHTML = '';
                        myWithdrawals.forEach((wit) => {
                            let isApproved = wit.status === 'approved' || wit.status === 'APPROVED';
                            let isRejected = wit.status === 'rejected' || wit.status === 'REJECTED';
                            let displayStatus = isApproved ? 'Completed' : (isRejected ? 'Failed' : wit.status);
                            let statusColor = isApproved ? '#34d399' : (isRejected ? '#f87171' : '#fbbf24');
                            let time = new Date(wit.createdAt || Date.now()).toLocaleString();

                            container.innerHTML += `
                                <div style="background: rgba(15, 23, 42, 0.9); border: 1px solid #7c3aed; padding: 14px; border-radius: 12px; font-size: 13px;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                                        <span style="color: #fbbf24; font-weight: bold; font-size: 15px;">₹${wit.amount}.00</span>
                                        <span style="color: ${statusColor}; text-transform: uppercase; font-weight: bold;">${displayStatus}</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8;">
                                        <span>Type: ${wit.type || 'BANK / UPI'}</span>
                                        <span>${time}</span>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        container.innerHTML = '<p style="font-size: 13px; color: #94a3b8; text-align: center; padding: 25px;">No withdrawal history found.</p>';
                    }
                }
            } catch (e) {
                document.getElementById('userWithdrawalHistory').innerHTML = '<p style="font-size: 13px; color: #f87171; text-align: center; padding: 25px;">Failed to load history.</p>';
            }
        }
    </script>
</body>
</html>
